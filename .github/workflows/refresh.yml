# Live board: run both pipelines on a schedule and publish site/ to GitHub Pages.
#
# One-time setup: repo Settings -> Pages -> "Build and deployment" -> Source: GitHub Actions.
# Secrets (Settings -> Secrets and variables -> Actions):
#   ODDS_API_KEY          optional, the-odds-api.com (Bet365 / Pinnacle / DraftKings feed)
#   NETLIFY_AUTH_TOKEN    optional; if both Netlify secrets exist the site is also pushed to Netlify
#   NETLIFY_SITE_ID       (non-fatal: a Netlify failure never blocks the Pages deploy)
#
# The SQLite databases persist between runs through the Actions cache, so each run
# only fetches new box scores, injuries and prices (the first run builds the baseline).

name: refresh-board

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (UTC); GitHub may delay by a few minutes
  workflow_dispatch:            # "Run workflow" button for a manual refresh

concurrency:
  group: refresh-board
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: nba-analyst-upload

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore databases
        uses: actions/cache/restore@v4
        with:
          path: |
            nba-analyst-upload/data/nba_analyst.sqlite
            nba-analyst-upload/data/nhl_analyst.sqlite
          key: dbs-${{ github.run_id }}
          restore-keys: dbs-

      - name: Bootstrap from snapshots (first run only)
        run: |
          if [ ! -f data/nba_analyst.sqlite ]; then
            python -m nba_analyst.load_snapshot data/nba_analyst.sqlite data/snapshot_2026-10-18
            python -m nba_analyst.load_snapshot data/nba_analyst.sqlite data/snapshot_2026-10-29
            python -m nba_analyst.load_snapshot data/nba_analyst.sqlite data/snapshot_2026-10-30
          fi
          if [ ! -f data/nhl_analyst.sqlite ]; then
            python -m nhl_analyst.load_snapshot data/nhl_analyst.sqlite data/nhl_snapshot_2026-10-29
            python -m nhl_analyst.load_snapshot data/nhl_analyst.sqlite data/nhl_snapshot_2026-10-30
          fi

      - name: Run pipelines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m nba_analyst run --max-summaries 150
          python -m nhl_analyst run --max-summaries 150

      - name: Build site
        run: python -m nba_analyst export-site site

      - name: Save databases
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            nba-analyst-upload/data/nba_analyst.sqlite
            nba-analyst-upload/data/nhl_analyst.sqlite
          key: dbs-${{ github.run_id }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: nba-analyst-upload/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to Netlify (optional)
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then echo "Netlify secrets not set, skipping"; exit 0; fi
          npx --yes netlify-cli@17 deploy --prod --dir=site --message "board refresh $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Netlify deploy failed (non-fatal)"
