<title>Sports Analyst Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a fixed top bar with tabs; one scrolling column of panels; tables and charts sit on cards, everything else on the page plane. */
:root {
  --bg: #f4f4f1; --surface: #fcfcfb; --surface-2: #efeeea; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --line: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --home: #2a78d6; --away: #eb6834; --seq: #2a78d6; --seq-light: #9ec5f4; --violet: #6250d6;
  --good: #0ca30c; --good-text: #006300; --warn: #fab219; --crit: #d03b3b; --neutral-mid: #f0efec;
  --font-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --line: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --home: #3987e5; --away: #d95926; --seq: #3987e5; --seq-light: #1c5cab; --violet: #9085e9;
    --good: #0ca30c; --good-text: #0ca30c; --warn: #fab219; --crit: #d03b3b; --neutral-mid: #383835;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --line: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --home: #3987e5; --away: #d95926; --seq: #3987e5; --seq-light: #1c5cab; --violet: #9085e9;
  --good: #0ca30c; --good-text: #0ca30c; --warn: #fab219; --crit: #d03b3b; --neutral-mid: #383835;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-inner { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: 0.01em; }
.brand small { font-family: var(--font-body); font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { font: inherit; font-weight: 500; color: var(--ink-2); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
nav button:hover { background: var(--surface-2); }
nav button[aria-current="page"] { color: var(--ink); background: var(--surface-2); border-color: var(--line); }
nav button:focus-visible, button:focus-visible, select:focus-visible, tr[tabindex]:focus-visible { outline: 2px solid var(--home); outline-offset: 2px; }
.spacer { flex: 1; }
.sportsw { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.sportsw button { font: inherit; font-weight: 600; font-size: 13px; letter-spacing: 0.04em; color: var(--ink-2); background: var(--surface); border: 0; padding: 6px 14px; cursor: pointer; }
.sportsw button + button { border-left: 1px solid var(--line); }
.sportsw button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.meta { color: var(--muted); font-size: 12px; }
main { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 22px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin: 0 0 10px; letter-spacing: 0.01em; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 14px; margin: 0 0 6px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
.sub { color: var(--ink-2); margin: 4px 0 0; max-width: 70ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.tile .label { font-size: 12px; color: var(--ink-2); }
.tile .value { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.1; }
.tile .delta { font-size: 12px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.row { display: grid; gap: 16px; }
.row.two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.chip { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; line-height: 1.5; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); margin: 2px 4px 2px 0; }
.chip.good { border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.chip.bad { border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
.chip.out { border-color: var(--crit); color: var(--ink); font-weight: 600; }
.chip .ico { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.pill { display: inline-block; border-radius: 4px; padding: 1px 7px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }
.pill.cand { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good-text); }
.pill.thin { background: var(--surface-2); color: var(--ink-2); }
.pill.none { color: var(--muted); }
.pill.illiq { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); color: var(--ink); }
.edge-pos { color: var(--good-text); font-weight: 600; }
.edge-neg { color: var(--muted); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
svg { display: block; max-width: 100%; height: auto; font-family: var(--font-body); }
svg text { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .axis-line { stroke: var(--axis); stroke-width: 1; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .mark { cursor: pointer; }
.tooltip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12px; max-width: 260px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
.winbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.winbar div { display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 600; color: #fff; min-width: 0; overflow: hidden; }
.winbar .h { background: var(--home); } .winbar .a { background: var(--away); justify-content: flex-end; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.filters button, .btn { font: inherit; font-size: 13px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); border-color: var(--axis); }
select { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.note { font-size: 12px; color: var(--muted); }
.warn { border-left: 3px solid var(--warn); padding: 6px 10px; background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border-radius: 4px; font-size: 13px; }
.minibar { display: inline-block; height: 8px; background: var(--seq); border-radius: 0 3px 3px 0; vertical-align: middle; margin-left: 6px; }
.stack { display: grid; gap: 10px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } .tile .value { font-size: 22px; } }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; display: grid; gap: 6px; min-width: 0; }
.gcard:hover, .pcard:hover { border-color: var(--axis); background: var(--surface-2); }
.gcard .m { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; min-width: 0; }
.pcard .n { font-weight: 600; }
.pcard .s { font-size: 12px; color: var(--ink-2); }
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
.tag.floor { background: color-mix(in srgb, var(--home) 18%, var(--surface)); color: var(--ink); }
.tag.safe { background: color-mix(in srgb, var(--good) 20%, var(--surface)); color: var(--good-text); }
.tag.value { background: color-mix(in srgb, var(--violet) 20%, var(--surface)); color: var(--ink); }
.tag.under { background: color-mix(in srgb, var(--away) 20%, var(--surface)); color: var(--ink); }
.tag.thin { background: var(--surface-2); color: var(--muted); }
tr.dim td { color: var(--muted); }
.sugg { display: grid; gap: 4px; font-size: 13px; }
.sugg .big { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.crumbs { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs button { font: inherit; color: var(--ink-2); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.back { font: inherit; color: var(--ink-2); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) { nav button, .filters button { transition: background 0.15s; } }
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand"><span id="brand">Sports Analyst</span> <small id="season"></small></div>
    <div id="sports" class="sportsw" hidden role="tablist" aria-label="Sport"></div>
    <nav id="nav" aria-label="Views">
      <button data-view="props" aria-current="page">Props</button>
      <button data-view="board">Board</button>
      <button data-view="games">Games</button>
      <button data-view="players">Players</button>
      <button data-view="picks">Picks</button>
    </nav>
    <span class="spacer"></span>
    <span class="meta" id="generated"></span>
    <button class="btn" id="refresh" hidden>Refresh</button>
  </div>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<div id="tip" class="tooltip" hidden></div>

<script>
(function () {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pct = (p, nd = 1) => p == null ? '–' : (100 * p).toFixed(nd) + '%';
  const f1 = v => v == null ? '–' : Number(v).toFixed(1);
  const sg = (v, nd = 1) => v == null ? '–' : (v >= 0 ? '+' : '') + Number(v).toFixed(nd);
  const money = v => (v < 0 ? '−$' : '$') + Math.abs(v).toFixed(2);
  const tip = (dt) => {
    const dtf = new Date(dt.replace('Z', ':00Z'));
    return dtf.toLocaleString('en-US', { timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' ET';
  };

  let D = null;
  const ALL = {};            // sport -> payload
  const STATES = {};         // sport -> view state, so switching sports keeps your place
  const freshState = () => ({ view: 'props', game: null, team: null, player: null, mfilter: 'all', pgame: null, pplayer: null, pstat: 'all', psort: 'safe' });
  let state = freshState();
  let sport = 'nba';
  try { const saved = JSON.parse(localStorage.getItem('board-state-v2') || '{}'); if (saved.sport) sport = saved.sport; Object.assign(STATES, saved.states || {}); } catch (e) {}
  const save = () => { STATES[sport] = state; try { localStorage.setItem('board-state-v2', JSON.stringify({ sport, states: STATES })); } catch (e) {} };

  // ---------- tooltip ----------
  const tipEl = $('#tip');
  document.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-tip]');
    if (!t) { tipEl.hidden = true; return; }
    tipEl.innerHTML = t.getAttribute('data-tip'); tipEl.hidden = false;
  });
  document.addEventListener('mousemove', e => {
    if (tipEl.hidden) return;
    const x = Math.min(e.clientX + 14, window.innerWidth - tipEl.offsetWidth - 8);
    tipEl.style.left = x + 'px'; tipEl.style.top = (e.clientY + 14) + 'px';
  });
  document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) tipEl.hidden = true; });

  // ---------- charts (inline SVG) ----------
  function columns(vals, labels, opts = {}) {
    // small column chart; vals numbers; opts: color, avg (reference line), line (prop line), h, tips[]
    const w = opts.w || 320, h = opts.h || 110, padL = 28, padB = 18, padT = 8;
    const n = vals.length; if (!n) return '<div class="note">No games yet.</div>';
    const maxV = Math.max(1, ...vals, opts.avg || 0, opts.line || 0) * 1.1;
    const iw = w - padL - 6, ih = h - padT - padB;
    const band = iw / n, bw = Math.min(24, band * 0.62);
    const y = v => padT + ih - (v / maxV) * ih;
    let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opts.label || '')}">`;
    const ticks = [0, Math.round(maxV / 2), Math.round(maxV)];
    ticks.forEach(t => { s += `<line class="grid" x1="${padL}" x2="${w - 6}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL - 4}" y="${y(t) + 4}" text-anchor="end">${t}</text>`; });
    vals.forEach((v, i) => {
      const x = padL + band * i + (band - bw) / 2, top = y(v), hh = Math.max(0, y(0) - top);
      s += `<path class="mark" fill="${opts.color || 'var(--seq)'}" d="M${x},${y(0)} v${-Math.max(0, hh - 4)} a4,4 0 0 1 4,-4 h${bw - 8} a4,4 0 0 1 4,4 v${Math.max(0, hh - 4)} z" data-tip="${esc(opts.tips ? opts.tips[i] : labels[i] + ': ' + v)}"/>`;
      const every = n > 6 ? 2 : 1;
      if (labels[i] != null && (n - 1 - i) % every === 0) s += `<text x="${x + bw / 2}" y="${h - 4}" text-anchor="middle">${esc(labels[i])}</text>`;
    });
    if (opts.avg != null) s += `<line x1="${padL}" x2="${w - 6}" y1="${y(opts.avg)}" y2="${y(opts.avg)}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    if (opts.line != null) s += `<line x1="${padL}" x2="${w - 6}" y1="${y(opts.line)}" y2="${y(opts.line)}" stroke="var(--crit)" stroke-width="2"/><text x="${padL + 2}" y="${y(opts.line) - 3}">line ${opts.line}</text>`;
    s += `<line class="axis-line" x1="${padL}" x2="${w - 6}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
    return s;
  }
  function marginColumns(games, team) {
    // win/loss margins; win = good, loss = critical (status, with W/L label below)
    const w = 360, h = 120, padL = 30, padB = 20, padT = 10, n = games.length;
    if (!n) return '<div class="note">No games yet.</div>';
    const maxA = Math.max(10, ...games.map(g => Math.abs(g.margin)));
    const iw = w - padL - 6, ih = h - padT - padB, band = iw / n, bw = Math.min(22, band * 0.6);
    const y = v => padT + ih / 2 - (v / maxA) * (ih / 2);
    let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Recent margins">`;
    [-maxA, 0, maxA].forEach(t => s += `<line class="grid" x1="${padL}" x2="${w - 6}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL - 4}" y="${y(t) + 4}" text-anchor="end">${sg(t, 0)}</text>`);
    games.forEach((g, i) => {
      const x = padL + band * i + (band - bw) / 2, m = g.margin, top = Math.min(y(0), y(m)), hh = Math.abs(y(0) - y(m));
      const col = m > 0 ? 'var(--good)' : 'var(--crit)';
      s += `<rect class="mark" x="${x}" y="${top}" width="${bw}" height="${Math.max(1, hh)}" rx="3" fill="${col}" data-tip="${esc((g.home ? 'vs ' : '@ ') + g.opp + ' · ' + g.pts + '-' + g.opp_pts + ' (' + sg(m, 0) + ')')}"/>`;
      s += `<text x="${x + bw / 2}" y="${h - 5}" text-anchor="middle">${m > 0 ? 'W' : 'L'}</text>`;
    });
    s += `<line class="axis-line" x1="${padL}" x2="${w - 6}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
    return s;
  }
  function ratingBars(rating, lg) {
    // diverging horizontal bars for off / def / pace relative to league
    if (!rating) return '<div class="note">No rating.</div>';
    const rows = [['Offense', rating.off, true], ['Defense', -rating.def, true], ['Pace', rating.pace, false]];
    const w = 320, rh = 22, padL = 62, h = rows.length * rh + 18, mid = padL + (w - padL - 10) / 2, scale = (w - padL - 10) / 2 / 8;
    let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Team ratings vs league">`;
    s += `<line class="axis-line" x1="${mid}" x2="${mid}" y1="4" y2="${h - 14}"/>`;
    rows.forEach(([lab, v, good], i) => {
      const y = 6 + i * rh, len = Math.min(Math.abs(v) * scale, (w - padL - 10) / 2), x = v >= 0 ? mid : mid - len;
      const col = !good ? 'var(--violet)' : (v >= 0 ? 'var(--good)' : 'var(--crit)');
      s += `<text x="${padL - 6}" y="${y + 13}" text-anchor="end">${lab}</text>`;
      s += `<rect class="mark" x="${x}" y="${y + 3}" width="${Math.max(1, len)}" height="14" rx="3" fill="${col}" data-tip="${esc(lab + ' ' + sg(lab === 'Defense' ? -v : v) + (lab === 'Pace' ? ' possessions' : ' pts/100') + ' vs league')}"/>`;
      s += `<text x="${v >= 0 ? x + len + 5 : x - 5}" y="${y + 14}" text-anchor="${v >= 0 ? 'start' : 'end'}">${sg(lab === 'Defense' ? -v : v)}</text>`;
    });
    s += `<text x="${padL}" y="${h - 2}">${lg ? 'league avg ORtg ' + f1(lg.ortg) + ', pace ' + f1(lg.poss) : ''}</text></svg>`;
    return s;
  }
  function dumbbell(games) {
    // per game: pure model home-win (muted) -> working number (home color), reference tick
    const w = 720, rh = 26, padL = 110, padR = 50, h = games.length * rh + 30, x = p => padL + p * (w - padL - padR);
    let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Home win probability: pure model vs working number">`;
    [0.25, 0.5, 0.75].forEach(t => s += `<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="8" y2="${h - 22}"/><text x="${x(t)}" y="${h - 8}" text-anchor="middle">${pct(t, 0)}</text>`);
    s += `<line class="axis-line" x1="${x(0.5)}" x2="${x(0.5)}" y1="8" y2="${h - 22}"/>`;
    games.forEach((g, i) => {
      const y = 18 + i * rh, pm = g.model_only.p_home_win ?? g.pred.p_home_win, pw = g.pred.p_home_win, pr = g.ref_probs ? g.ref_probs.p_home : null;
      s += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" class="lab" data-game="${g.game.game_id}">${esc(g.game.away + ' @ ' + g.game.home)}</text>`;
      s += `<line x1="${x(Math.min(pm, pw))}" x2="${x(Math.max(pm, pw))}" y1="${y}" y2="${y}" stroke="var(--axis)" stroke-width="2"/>`;
      if (pr != null) s += `<line x1="${x(pr)}" x2="${x(pr)}" y1="${y - 7}" y2="${y + 7}" stroke="var(--ink-2)" stroke-width="2" data-tip="${esc('Reference line implied ' + pct(pr))}"/>`;
      s += `<circle class="mark" cx="${x(pm)}" cy="${y}" r="5" fill="var(--muted)" stroke="var(--surface)" stroke-width="2" data-tip="${esc('Pure model: ' + g.game.home + ' ' + pct(pm))}"/>`;

      return `<section class="card stack"><h2>${statName(s)}</h2>
        <div class="row two"><div>${columns(vals, labs, { color: 'var(--seq)', avg: it.l10_avg, line: lineForChart, tips: rec.map((x, i) => `${x.date} ${x.home ? 'vs' : '@'} ${x.opp}: ${vals[i]} in ${x[minKey()]} ${minLabel().toLowerCase()}`), label: statName(s) + ' by game' })}
            <p class="note">L10 avg ${f1(it.l10_avg)} (sd ${f1(it.l10_sd)}) · L5 ${f1(it.l5_avg)} · season ${f1(it.season_avg)} · lowest in L10: <strong>${it.l10_min}</strong>. Projection <strong>${f1(it.proj)}</strong> ± ${f1(it.proj_sd)} at ${it.proj_min} ${minLabel().toLowerCase()}${it.matchup !== 1 ? ` · matchup ×${it.matchup.toFixed(3)}` : ''}${it.pace_factor && it.pace_factor !== 1 ? ` · pace ×${it.pace_factor.toFixed(3)}` : ''}${it.bump ? ` · +${it.bump.toFixed(1)} min (teammate out)` : ''}${it.rate60 != null ? ` · ${f1(it.rate60)} per 60` : ''}${it.p10 != null ? `. 10th percentile ≈ ${it.p10}` : ''}.${it.starter_note ? ` <strong>${esc(it.starter_note)}</strong>` : ''}</p></div>
          <div>${sugg}</div></div>
        <div class="table-wrap"><table><thead><tr><th class="num">Line</th><th class="num">P(over)</th><th class="num">Best over (book)</th><th class="num">Edge</th><th class="num">P(under)</th><th class="num">Best under (book)</th><th class="num">Edge</th><th class="num">Hit L10 / L5</th><th>Books</th><th>Tag</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
    }).join('');
    return `<div><div class="crumbs"><button data-pback="matches">Matches</button><span>›</span><button data-pback="match">${esc(G.away + ' @ ' + G.home)}</button><span>›</span><span>${esc(P.player)}</span></div>
      <div class="eyebrow" style="margin-top:8px">${esc(t === G.home ? g.home_name : g.away_name)} · ${esc(P.position || '')} · ${P.games} games stored · ${tip(G.date_utc)} vs ${esc(opp)}</div><h1>${esc(P.player)}</h1>
      <p class="sub">${matchLine}${outs.length ? ` · ${esc(t)} out: ${esc(outs.join(', '))}` : ''}</p>
      ${items.length && items[0].flags && items[0].flags.length ? `<p class="warn">${esc(items[0].flags.join(', '))}: the market is pricing this player as if he may not play or may be limited. No suggestion until that is checked.</p>` : ''}</div>
      ${items.length ? ladders : '<section class="card"><div class="empty">No props listed for this player, or too few regular-season games to project.</div></section>'}
      <section class="card"><h2>Previous games</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Opp</th>${pcols.map(([k, l]) => `<th class="num">${esc(l)}</th>`).join('')}<th></th></tr></thead><tbody>${prevRows}</tbody></table></div></section>`;
  }
  function viewProps() {
    if (state.pgame) {
      const g = D.games.find(x => x.game.game_id === state.pgame);
      if (g) return state.pplayer ? propsPlayer(g, state.pplayer) : propsMatch(g);
    }
    return propsMatches();
  }

  // ---------- render / routing ----------
  function render() {
    const app = $('#app');
    let html;
    if (state.view === 'props') html = viewProps();
    else if (state.view === 'game') html = viewGame(state.game);
    else if (state.view === 'games') html = viewGames();
    else if (state.view === 'players') html = viewPlayers();
    else if (state.view === 'picks') html = viewPicks();
    else html = viewBoard();
    app.innerHTML = html;
    const cur = state.view === 'game' ? 'games' : state.view;
    document.querySelectorAll('#nav button').forEach(b => { if (b.dataset.view === cur) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    save();
    window.scrollTo({ top: 0 });
  }
  document.addEventListener('click', e => {
    const nb = e.target.closest('[data-view]'); if (nb) { state.view = nb.dataset.view; if (nb.dataset.view === 'props' && nb.closest('#nav')) { state.pgame = null; state.pplayer = null; } render(); return; }
    const pb = e.target.closest('[data-pback]'); if (pb) { state.view = 'props'; if (pb.dataset.pback === 'matches') { state.pgame = null; } state.pplayer = null; render(); return; }
    const pp = e.target.closest('[data-pplayer]'); if (pp) { state.view = 'props'; if (pp.dataset.pgame) state.pgame = pp.dataset.pgame; state.pplayer = pp.dataset.pplayer; render(); return; }
    const pg = e.target.closest('[data-pgame]'); if (pg) { state.view = 'props'; state.pgame = pg.dataset.pgame; state.pplayer = null; render(); return; }
    const gr = e.target.closest('[data-game]'); if (gr) { state.view = 'game'; state.game = gr.dataset.game; state.mfilter = 'all'; render(); return; }
    const mf = e.target.closest('[data-mf]'); if (mf) { state.mfilter = mf.dataset.mf; render(); return; }
    const pr = e.target.closest('[data-player]'); if (pr) { state.player = pr.dataset.player; render(); return; }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter') { const t = e.target.closest('[data-game],[data-player],[data-pgame],[data-pplayer]'); if (t) t.click(); } });
  document.addEventListener('change', e => { if (e.target.id === 'teamsel') { state.team = e.target.value; state.player = null; render(); } });

  function showSport(key) {
    if (!ALL[key]) return;
    sport = key; D = ALL[key];
    state = STATES[key] || freshState();
    $('#season').textContent = D.season_label;
    $('#brand').textContent = Object.keys(ALL).length > 1 ? 'Sports Analyst' : (D.sport_label || 'NBA') + ' Analyst';
    $('#generated').textContent = 'updated ' + D.generated_at.replace('T', ' ');
    const sw = $('#sports'); const keys = Object.keys(ALL);
    sw.hidden = keys.length < 2;
    sw.innerHTML = keys.map(k => `<button role="tab" data-sport="${k}" aria-selected="${k === sport}">${esc(ALL[k].sport_label || k.toUpperCase())}</button>`).join('');
    if (!state.team) state.team = D.games[0] ? D.games[0].game.home : Object.keys(D.teams)[0];
    if (state.view === 'game' && !D.games.some(g => g.game.game_id === state.game)) state.view = 'board';
    if (state.pgame && !D.games.some(g => g.game.game_id === state.pgame)) { state.pgame = null; state.pplayer = null; }
    render();
  }
  document.addEventListener('click', e => { const b = e.target.closest('[data-sport]'); if (b) { save(); showSport(b.dataset.sport); } });
  function boot(data) {
    // data: a single payload, or { sports: { nba: payload, nhl: payload } }
    if (data && data.sports) { Object.keys(data.sports).forEach(k => { ALL[k] = data.sports[k]; }); }
    else { ALL[(data.sport || 'nba')] = data; }
    showSport(ALL[sport] ? sport : Object.keys(ALL)[0]);
  }
  // Data sources, in order: embedded (standalone file), the local server's API, or a
  // static data.json next to the page (the hosted site, rebuilt by the scheduled job).
  let source = null, lastStamp = null;
  const stampOf = d => d.sports ? Object.values(d.sports).map(x => x.generated_at).join('|') : d.generated_at;
  async function fetchData(recompute) {
    if (source === 'api' || source === null) {
      try { const r = await fetch('api/dashboard' + (recompute ? '?recompute=1' : ''), { cache: 'no-store' }); if (r.ok) { source = 'api'; return await r.json(); } } catch (e) {}
    }
    if (source === 'static' || source === null) {
      const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) { source = 'static'; return await r.json(); }
    }
    throw new Error('no data source');
  }
  async function load() {
    if (window.__DATA__) { boot(window.__DATA__); return; }
    try {
      const d = await fetchData(false); lastStamp = stampOf(d); boot(d);
      const btn = $('#refresh'); btn.hidden = false;
      btn.addEventListener('click', async () => { btn.textContent = 'Refreshing…'; try { const d2 = await fetchData(source === 'api'); lastStamp = stampOf(d2); boot(d2); } catch (e) {} btn.textContent = 'Refresh'; });
      // poll for a newer build; re-render only when the data actually changed (keeps your place)
      setInterval(async () => { try { const d3 = await fetchData(false); const st = stampOf(d3); if (st !== lastStamp) { lastStamp = st; save(); boot(d3); } } catch (e) {} }, 3 * 60 * 1000);
    } catch (err) {
      $('#app').innerHTML = `<div class="empty">Could not load data (${esc(err.message)}). Start the server with <code>python -m nba_analyst serve</code>, or publish a site folder with data.json next to this page.</div>`;
    }
  }
  load();
})();
</script>
